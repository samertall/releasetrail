name: Verify Onyx Deployer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-deployer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser script and contract payload
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const cp = require("node:child_process");
          const root = fs.readFileSync("index.html", "utf8");
          const deployer = fs.readFileSync("deployer/index.html", "utf8");
          const contract = fs.readFileSync("realm/releasetrail.gno", "utf8");
          const module = fs.readFileSync("realm/gnomod.toml", "utf8");
          assert.equal(root, deployer, "Root and deployer pages must match");
          const m = root.match(/<script>([\s\S]*?)<\/script>/);
          assert.ok(m, "Deployer must include a browser script");
          fs.writeFileSync("/tmp/releasetrail-deployer.js", m[1]);
          cp.execFileSync("node", ["--check", "/tmp/releasetrail-deployer.js"]);
          assert.ok(m[1].includes("const SOURCE="+JSON.stringify(contract)+";"), "Embedded contract must match realm source");
          assert.ok(m[1].includes("const GNOMOD="+JSON.stringify(module)+";"), "Embedded gnomod must match realm config");
          assert.ok(m[1].includes('send:"",max_deposit:MAX_DEPOSIT'), "Current vm MsgAddPackage fields required");
          assert.ok(m[1].includes('name:"gnomod.toml",body:GNOMOD'), "Must deploy gnomod.toml");
          assert.ok(m[1].includes('files:[{name:"gnomod.toml",body:GNOMOD},{name:"releasetrail.gno",body:SOURCE}]'), "AddPackage files must be sorted: gnomod.toml before releasetrail.gno");
          assert.ok(!m[1].includes('files:[{name:"releasetrail.gno",body:SOURCE},{name:"gnomod.toml",body:GNOMOD}]'), "Unsorted files rejected on-chain");
          assert.ok(!m[1].includes('deposit:"1ugnot"'), "Old deposit field forbidden");
          assert.ok(m[1].includes("const CHAIN=\"onyx-1\""), "Must target funded Onyx");
          console.log("Deployer syntax and source payload verified.");
          NODE
